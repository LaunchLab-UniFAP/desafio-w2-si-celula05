name: Validacao Tecnica e de Governanca

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validar Conventional Commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            intervalo="$BASE_SHA..$HEAD_SHA"
          elif git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            intervalo="$BASE_SHA..$HEAD_SHA"
          else
            intervalo="$HEAD_SHA^..$HEAD_SHA"
          fi

          padrao='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
          while IFS= read -r mensagem; do
            [ -z "$mensagem" ] && continue
            if [[ ! "$mensagem" =~ $padrao ]]; then
              echo "Commit fora do padrao: $mensagem"
              exit 1
            fi
          done < <(git log --no-merges --format=%s "$intervalo")

      - name: Verificar sintaxe Python
        run: python -m compileall -q src tests

      - name: Executar testes automatizados
        run: python -m unittest discover -s tests -v

      - name: Validar fluxo integrado ADS
        shell: bash
        run: |
          saida="$(printf '20\n35\n' | python -m src.coleta_ads)"
          grep -Fq "Volume Total: 55 m³" <<< "$saida"
          grep -Fq "Status: Capacidade Maxima Atingida" <<< "$saida"

      - name: Validar regra de governanca SI
        run: >-
          python -c "from src.governanca_si import calcular_eficiencia_financeira;
          assert calcular_eficiencia_financeira(10) ==
          'Alerta: Alto Custo de Ociosidade Detectado'"
